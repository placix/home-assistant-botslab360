name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --draft
            --title "$GITHUB_REF_NAME"
          )

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
