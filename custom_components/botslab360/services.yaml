clean_rooms:
  name: Clean rooms
  description: Start cleaning one or more rooms selected by their map IDs.
  target:
    entity:
      domain: vacuum
      integration: botslab360
  fields:
    room_ids:
      name: Room IDs
      description: Room IDs from the current Botslab room map.
      required: true
      example: [1, 6]
      selector:
        object:
    clean_times:
      name: Cleaning passes
      description: Number of cleaning passes for every selected room.
      selector:
        number:
          min: 1
          max: 2
          step: 1
          mode: box
    fan_mode:
      name: Fan mode
      description: Fan mode for every selected room.
      selector:
        select:
          options:
            - quiet
            - auto
            - strong
            - max
    water_pump:
      name: Water level
      description: Water level for every selected room.
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box
